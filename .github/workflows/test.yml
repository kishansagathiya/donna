name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (test, vet, build, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-server-go
    env:
      GO_MIN_COVERAGE: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: donna-server-go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Check coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ { gsub("%", "", $3); print $3 }' coverage.txt)
          if [ -z "$total" ]; then
            echo "Could not parse coverage total from coverage.out"
            exit 1
          fi
          echo "Total coverage: ${total}% (minimum ${GO_MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$GO_MIN_COVERAGE" 'BEGIN {
            if (t+0 < m+0) {
              printf "Coverage %.1f%% is below the %.0f%% minimum.\n", t, m
              exit 1
            }
          }'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            donna-server-go/coverage.out
            donna-server-go/coverage.html
            donna-server-go/coverage.txt
          if-no-files-found: ignore

  app:
    name: App (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: donna-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test -- src/voice/__tests__ __tests__/App.test.tsx

  web:
    name: Web (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: donna-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Build
        run: npm run build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [go, app, web]
    if: always()
    steps:
      - name: Require all checks
        run: |
          if [[ "${{ needs.go.result }}" != "success" ||
                "${{ needs.app.result }}" != "success" ||
                "${{ needs.web.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
