name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (test, vet, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-server-go
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: donna-server-go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -race -count=1

  app:
    name: App (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: donna-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test -- src/voice/__tests__ __tests__/App.test.tsx

  web:
    name: Web (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donna-web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: donna-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Build
        run: npm run build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [go, app, web]
    if: always()
    steps:
      - name: Require all checks
        run: |
          if [[ "${{ needs.go.result }}" != "success" ||
                "${{ needs.app.result }}" != "success" ||
                "${{ needs.web.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
